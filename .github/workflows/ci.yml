name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: prove test/

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:renesas_uno@1.6.0
      - run: cp signal/arduino_secrets.h.example signal/arduino_secrets.h
      - run: arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi signal
